<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050708"><title>África — Sistema Interativo</title>
<style>
:root{color-scheme:dark;--bg:#050708;--panel:#0c1113;--line:#26383a;--muted:#829497;--cyan:#54e6d0;--green:#a3f5a8;--red:#ff8c80}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#142326 0,#080d0f 44%,#030506 100%);color:#e9f3f1;font:15px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;min-height:100vh}
header{padding:25px 5vw 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1c2b2d}
.brand{display:flex;align-items:center;gap:12px}.symbol{width:34px;height:34px;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font-weight:900;transform:rotate(45deg)}.symbol span{transform:rotate(-45deg)}.brand strong{font-size:.86rem;letter-spacing:.15em}.status{font-size:.7rem;letter-spacing:.14em;color:#91aaa8;text-transform:uppercase}.status:before{content:"";display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:8px;box-shadow:0 0 10px var(--green)}
main{width:min(1150px,94vw);margin:30px auto 60px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{color:var(--cyan);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(1.65rem,4vw,2.65rem);letter-spacing:-.04em;margin:5px 0}.intro p{margin:0;color:var(--muted);max-width:430px;font-size:.9rem}
.workspace{border:1px solid var(--line);background:linear-gradient(145deg,#0d1517dd,#070b0c);border-radius:18px;overflow:hidden;box-shadow:0 24px 70px #0008}.map-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;color:#93aaa8;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.map-head b{color:var(--cyan);font-weight:700}
.map-stage{position:relative;padding:24px 12px 12px;display:flex;justify-content:center;perspective:1000px;min-height:540px;align-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#244b3b66,transparent 58%),radial-gradient(ellipse at 15% 90%,#173b2a88,transparent 35%),radial-gradient(ellipse at 85% 86%,#173b2a88,transparent 35%),linear-gradient(180deg,#0b1715,#101c17 68%,#09110e)}
.map3d{position:relative;z-index:1;width:min(720px,100%);transform:rotateX(18deg) rotateZ(-2deg);transform-style:preserve-3d;transition:transform .75s,width .75s;filter:drop-shadow(0 25px 20px #0009)}.map3d.zoomed{width:min(1000px,150%);transform:rotateX(5deg) rotateZ(0) scale(1.08)}svg{width:100%;height:auto;max-height:510px;overflow:visible;display:block}.map-stage:before,.map-stage:after{content:"";position:absolute;z-index:0;bottom:-20px;width:48%;height:155px;opacity:.7;pointer-events:none;background:radial-gradient(ellipse at 15% 90%,#315d37 0 4%,transparent 5%),radial-gradient(ellipse at 28% 75%,#244b30 0 7%,transparent 8%),radial-gradient(ellipse at 43% 95%,#3b6840 0 6%,transparent 7%),radial-gradient(ellipse at 62% 78%,#244b30 0 8%,transparent 9%),radial-gradient(ellipse at 78% 92%,#315d37 0 7%,transparent 8%);filter:blur(.3px)}.map-stage:before{left:0}.map-stage:after{right:0;transform:scaleX(-1)}.map-stage.zoom-active .map3d{z-index:2}.map-stage.zoom-active .map-labels{opacity:0}
.region{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .55s ease,filter .3s,transform .55s;outline:none}.country{fill:#29484a;stroke:#a5d2c9;stroke-width:.75;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 2px 0 #142729) drop-shadow(0 4px 0 #1c393b) drop-shadow(0 6px 0 #102022) drop-shadow(0 9px 4px #000c);transition:fill .2s,stroke .2s,filter .2s}.region[data-region="north"] .country{fill:#29474b}.region[data-region="west"] .country{fill:#244c43}.region[data-region="east"] .country{fill:#254553}.region[data-region="south"] .country{fill:#4a3d50}.region:hover .country,.region:focus .country{fill:#4c7772;stroke:#e4fffa;stroke-width:1.15}.region.selected{filter:drop-shadow(0 18px 0 #142729) drop-shadow(0 24px 8px #000);transform:translateY(-8px) scale(1.012)}.region.dimmed{opacity:.12;pointer-events:none}.region.vanish{opacity:0;transform:translateY(-80px) scale(.96);pointer-events:none}
.map-labels text{font:800 12px system-ui;fill:#d5e9e4;text-anchor:middle;letter-spacing:2px;paint-order:stroke;stroke:#071012;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.map-footer{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;color:#718887;font-size:.72rem}.legend{display:flex;gap:14px;flex-wrap:wrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--cyan)}
.question-area{display:none;position:absolute;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);width:min(590px,calc(100% - 30px));max-height:72%;overflow:auto;padding:17px 19px;border:1px solid #8eb8a477;border-radius:16px;background:linear-gradient(145deg,#081512ed,#0b1715eF);backdrop-filter:blur(13px);box-shadow:0 18px 55px #000b, inset 0 1px #d8ffe51a;animation:reveal .45s ease both}.question-area.visible{display:block}@keyframes reveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.q-kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:800}.q-title{font-size:1.05rem;margin:4px 0 8px}.q-text{font-size:.94rem;font-weight:650;margin:0 0 11px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.option{border:1px solid #2b4142;background:#101a1c;color:#dce9e6;padding:13px 15px;text-align:left;border-radius:10px;cursor:pointer;font:500 .9rem/1.45 inherit;transition:.2s}.option:hover:not(:disabled){border-color:var(--cyan);background:#132728;transform:translateY(-2px)}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#6ddc8d;background:#10271b;color:#b9ffc8}.option.wrong{border-color:#e68173;background:#2b1717;color:#ffc1b9}.feedback{min-height:28px;margin:14px 0 0;font-size:.9rem;font-weight:700}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.bottom-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}.reset{border:1px solid #365254;background:transparent;color:#b8ceca;border-radius:8px;padding:9px 13px;cursor:pointer}.reset:hover{border-color:var(--cyan);color:white}.hint{color:#829795;font-size:.75rem}
@media(max-width:700px){header{padding:18px 4vw}.status{display:none}main{margin-top:20px}.intro{display:block}.intro p{margin-top:8px}.map-stage{min-height:510px;padding:15px 4px}.map3d{transform:rotateX(12deg) rotateZ(-2deg)}.map3d.zoomed{width:145%;transform:rotateX(0) scale(1.08)}.options{grid-template-columns:1fr}.question-area{bottom:12px;padding:13px 14px;width:calc(100% - 20px);max-height:68%}.option{padding:10px 12px}.map-head,.map-footer{font-size:.65rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Satellite terrain inspired by the reference image */
body{background:#0a1218;color:#e8e8e8}
header,.intro,.map-head,.map-footer{display:none!important}
main{width:100%;margin:0;max-width:none}
.workspace{border:0;border-radius:0;background:#0a1218;box-shadow:none;min-height:100vh}
.map-stage{min-height:100vh;padding:20px 8px;background:radial-gradient(ellipse at 50% 45%,#1a2e38 0%,#0d1a22 50%,#070e14 100%)}
.map3d{filter:drop-shadow(0 28px 22px #000a)}
.map3d.zoomed{filter:drop-shadow(0 28px 26px #000)}
.country{stroke:#c5cfc9!important;stroke-width:0.7;filter:url(#terrainTexture) drop-shadow(0 1.5px 0 #1a2a24) drop-shadow(0 4px 3px #0009)}
.region[data-region="north"] .country{fill:#c4a97a!important}
.region[data-region="west"] .country{fill:#5f8a5a!important}
.region[data-region="east"] .country{fill:#7a9568!important}
.region[data-region="south"] .country{fill:#4d7350!important}
.region:hover .country,.region:focus .country{fill:#9ab585!important;stroke:#f0f5f0!important}
.region.selected .country{stroke:#fff!important;stroke-width:1.2}
.region:focus,.region:focus-visible,svg g:focus,svg g:focus-visible{outline:0!important;box-shadow:none!important}
svg{-webkit-tap-highlight-color:transparent}
.map-labels text{fill:#f5f5f5;stroke:#0a1218;stroke-width:3.5px;font:800 13px system-ui;letter-spacing:1.5px}
.map-stage:before,.map-stage:after{opacity:.15;filter:blur(1.2px);background:radial-gradient(ellipse at 15% 90%,#3d6b42 0 4%,transparent 5%),radial-gradient(ellipse at 28% 75%,#2a5232 0 7%,transparent 8%),radial-gradient(ellipse at 43% 95%,#5a7a4a 0 6%,transparent 7%),radial-gradient(ellipse at 62% 78%,#2a5232 0 8%,transparent 9%),radial-gradient(ellipse at 78% 92%,#3d6b42 0 7%,transparent 8%)}
.question-area{border-color:#666;background:linear-gradient(145deg,#0c1012f5,#161a1cf5);color:#f2f2f2;box-shadow:0 18px 55px #000, inset 0 1px #fff1}
.q-kicker{color:#cdd}.option{border-color:#444;background:#141819;color:#eee}
.option:hover:not(:disabled){border-color:#ccc;background:#252a2c}
.option.correct{border-color:#8c8;background:#1e2a22;color:#dff}
.option.wrong{border-color:#a88;background:#2a1e1e;color:#fdd}
.feedback.good,.feedback.bad{color:#eee}
.reset{border-color:#666;color:#ddd}
.hint{color:#999}
@media(max-width:700px){.map-stage{min-height:100vh}.map3d{width:min(720px,100%)}}
</style></head><body>
